<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Royale - AI Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: radial-gradient(circle at center, #1a080c 0%, #080204 100%); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { background: rgba(18, 5, 8, 0.95); border: 2px solid #ffaa00; border-radius: 20px; padding: 22px; width: 100%; max-width: 480px; box-shadow: 0 0 30px rgba(255, 170, 0, 0.25); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 170, 0, 0.3); padding-bottom: 12px; }
        h1 { color: #ffcc00; font-size: 20px; text-shadow: 0 0 10px rgba(255, 204, 0, 0.4); }
        .progress-badge { background: #3a1200; border: 1px solid #ffaa00; padding: 5px 12px; border-radius: 20px; font-size: 13px; color: #ffcc00; font-weight: bold; }

        .setup-screen, .quiz-screen, .score-screen { display: flex; flex-direction: column; gap: 15px; }
        .hidden { display: none !important; }

        .input-group { display: flex; gap: 8px; margin-bottom: 5px; }
        input { flex: 1; background: #0d0305; border: 1px solid #ffaa00; color: #fff; padding: 12px; border-radius: 10px; font-size: 15px; outline: none; }
        
        .btn { background: linear-gradient(135deg, #cc8800, #ffaa00); border: none; color: #120305; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; text-align: center; box-shadow: 0 4px 15px rgba(255, 170, 0, 0.3); }
        .btn:active { transform: scale(0.97); }

        .stats-bar { display: flex; justify-content: space-between; font-size: 13px; color: #cc8855; font-weight: bold; text-transform: uppercase; }
        
        .question-box { background: rgba(30, 8, 12, 0.9); border: 1px solid rgba(255, 170, 0, 0.4); border-radius: 12px; padding: 18px; font-size: 16px; text-align: center; min-height: 90px; display: flex; align-items: center; justify-content: center; line-height: 1.4; color: #fff; }

        .options { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn { background: #1a060a; border: 1px solid rgba(255, 170, 0, 0.3); color: #ffebcc; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; text-align: left; transition: all 0.2s; }
        .opt-btn:hover:not(:disabled) { background: #330c14; border-color: #ffaa00; transform: translateY(-2px); }
        .opt-btn.correct { background: #004d26 !important; border-color: #00ff88 !important; color: #fff !important; }
        .opt-btn.wrong { background: #4d0000 !important; border-color: #ff4444 !important; color: #fff !important; }

        .timer-container { height: 6px; background: #2a0a10; border-radius: 3px; overflow: hidden; margin-top: 5px; }
        .timer-bar { height: 100%; background: #ffaa00; width: 100%; transition: width 1s linear; }

        .loader { text-align: center; padding: 40px; color: #ffcc00; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎯 QUIZ ROYALE AI</h1>
            <div class="progress-badge" id="progress-indicator">1 / 10</div>
        </div>

        <!-- Écran de configuration -->
        <div id="setup-screen" class="setup-screen">
            <p style="color: #aa7755; font-size: 14px;">Choisis ton thème pour une session de 10 questions générées par l'IA :</p>
            <div class="input-group">
                <input type="text" id="category-input" value="Football" placeholder="Ex: Anime, Électronique, Histoire...">
                <button class="btn" onclick="startQuizSession()">🚀 Go</button>
            </div>
        </div>

        <!-- Écran de chargement -->
        <div id="loading-screen" class="loader hidden">
            🤖 L'IA prépare tes 10 questions... Patiente un instant.
        </div>

        <!-- Écran du Quiz -->
        <div id="quiz-screen" class="quiz-screen hidden">
            <div class="stats-bar">
                <span id="score-text">Score : 0</span>
                <span id="streak-text">Série : 🔥 0</span>
            </div>

            <div class="question-box" id="question-text">Chargement...</div>

            <div class="options" id="options-container"></div>

            <div class="timer-container">
                <div class="timer-bar" id="timer-bar"></div>
            </div>
        </div>

        <!-- Écran de fin / Score final -->
        <div id="score-screen" class="score-screen hidden" style="text-align: center; padding: 20px 0;">
            <h2 style="color: #ffcc00; font-size: 24px; margin-bottom: 10px;">🏆 Session Terminée !</h2>
            <p id="final-score-text" style="font-size: 18px; margin-bottom: 20px; color: #fff;"></p>
            <button class="btn" onclick="resetToSetup()">🔄 Rejouer une partie</button>
        </div>
    </div>

    <script>
        const AI_API_URL = 'https://christus-s-apis.vercel.app/api/na/ai/gemini';
        
        let questionsList = [];
        let currentIndex = 0;
        let score = 0;
        let streak = 0;
        let timer = null;
        let timeLeft = 30;

        async function startQuizSession() {
            const category = document.getElementById('category-input').value.trim() || "Culture Générale";
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            const prompt = `Génère exactement 10 questions de quiz uniques sur le thème "${category}". 
            Réponds STRICTEMENT sous forme d'un tableau JSON pur (sans markdown, ni balises ```json ... ```), contenant 10 objets avec cette structure exacte :
            [
              {
                "question": "Énoncé de la question",
                "options": ["Option A", "Option B", "Option C", "Option D"],
                "answer": "La réponse exacte (doit correspondre exactement à l'une des 4 options)"
              }
            ]`;

            try {
                const res = await fetch(AI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                let rawText = data?.result?.answer || data?.result || data?.answer || "";
                rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();

                questionsList = JSON.parse(rawText);
                currentIndex = 0;
                score = 0;
                streak = 0;

                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                loadQuestion();
            } catch (err) {
                console.error("Erreur génération:", err);
                alert("Erreur de génération par l'IA. Réessaie.");
                resetToSetup();
            }
        }

        function loadQuestion() {
            if (currentIndex >= questionsList.length) {
                endSession();
                return;
            }

            const q = questionsList[currentIndex];
            document.getElementById('progress-indicator').innerText = `${currentIndex + 1} / ${questionsList.length}`;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('score-text').innerText = `Score : ${score}`;
            document.getElementById('streak-text').innerText = `Série : 🔥 ${streak}`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(opt, btn);
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 30;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';

            timer = setInterval(() => {
                timeLeft--;
                bar.style.width = `${(timeLeft / 30) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function selectAnswer(selected, btnElement) {
            clearInterval(timer);
            const q = questionsList[currentIndex];
            const buttons = document.querySelectorAll('.opt-btn');
            buttons.forEach(b => b.disabled = true);

            const isCorrect = selected.trim().toLowerCase() === q.answer.trim().toLowerCase();

            if (isCorrect) {
                score++;
                streak++;
                btnElement.classList.add('correct');
            } else {
                streak = 0;
                btnElement.classList.add('wrong');
                // Montrer la bonne réponse
                buttons.forEach(b => {
                    if (b.innerText.trim().toLowerCase() === q.answer.trim().toLowerCase()) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1500);
        }

        function handleTimeOut() {
            const q = questionsList[currentIndex];
            const buttons = document.querySelectorAll('.opt-btn');
            buttons.forEach(b => b.disabled = true);
            streak = 0;

            buttons.forEach(b => {
                if (b.innerText.trim().toLowerCase() === q.answer.trim().toLowerCase()) {
                    b.classList.add('correct');
                }
            });

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1500);
        }

        function endSession() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('score-screen').classList.remove('hidden');
            document.getElementById('progress-indicator').innerText = 'Terminé';
            document.getElementById('final-score-text').innerText = `Tu as obtenu ${score} / ${questionsList.length} bonnes réponses !`;
        }

        function resetToSetup() {
            document.getElementById('score-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('progress-indicator').innerText = '1 / 10';
        }
    </script>
</body>
</html>
