<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Royale - Crimson Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: radial-gradient(circle at center, #180205 0%, #050001 100%); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; overflow-x: hidden; }
        
        .container { background: rgba(15, 2, 4, 0.96); border: 2px solid #ff1a40; border-radius: 20px; padding: 22px; width: 100%; max-width: 480px; box-shadow: 0 0 40px rgba(255, 26, 64, 0.25); display: flex; flex-direction: column; justify-content: space-between; min-height: 520px; position: relative; animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 26, 64, 0.3); padding-bottom: 12px; margin-bottom: 15px; }
        h1 { color: #ff3355; font-size: 20px; text-shadow: 0 0 12px rgba(255, 51, 85, 0.5); letter-spacing: 0.5px; }
        .progress-badge { background: #3a000a; border: 1px solid #ff1a40; padding: 5px 12px; border-radius: 20px; font-size: 13px; color: #ff6680; font-weight: bold; }

        .screen { display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .hidden { display: none !important; }

        .setup-content { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .setup-content p { color: #aa7780; font-size: 14px; line-height: 1.4; }

        .bottom-bar { display: flex; gap: 8px; margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255, 26, 64, 0.2); }
        input { flex: 1; background: #0a0102; border: 1px solid #ff1a40; color: #fff; padding: 12px 15px; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s; }
        input:focus { box-shadow: 0 0 12px rgba(255, 26, 64, 0.5); border-color: #ff3355; }
        
        .btn { background: linear-gradient(135deg, #cc0033, #ff1a40); border: none; color: #fff; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; text-align: center; box-shadow: 0 4px 15px rgba(255, 26, 64, 0.4); white-space: nowrap; }
        .btn:active { transform: scale(0.96); }

        .stats-bar { display: flex; justify-content: space-between; font-size: 13px; color: #aa7780; font-weight: bold; text-transform: uppercase; margin-bottom: 12px; }
        
        .question-box { background: rgba(25, 4, 8, 0.9); border: 1px solid rgba(255, 26, 64, 0.4); border-radius: 14px; padding: 18px; font-size: 15px; text-align: left; min-height: 95px; display: flex; align-items: center; line-height: 1.5; color: #fff; margin-bottom: 15px; box-shadow: inset 0 0 15px rgba(0,0,0,0.6); }
        .typing-cursor::after { content: '|'; animation: blink 0.7s infinite; color: #ff1a40; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .opt-btn { background: #1a0307; border: 1px solid rgba(255, 26, 64, 0.3); color: #ffccd5; padding: 13px 15px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; text-align: left; transition: all 0.2s ease; display: flex; align-items: center; width: 100%; }
        .opt-btn:hover:not(:disabled) { background: #33060f; border-color: #ff1a40; transform: translateX(4px); }
        .opt-btn.correct { background: #004d26 !important; border-color: #00ff88 !important; color: #fff !important; }
        .opt-btn.wrong { background: #4d0011 !important; border-color: #ff1a40 !important; color: #fff !important; }

        .timer-container { height: 5px; background: #26050a; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
        .timer-bar { height: 100%; background: #ff1a40; width: 100%; transition: width 1s linear; }

        .loader-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; gap: 15px; padding: 30px 0; }
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(255, 26, 64, 0.2); border-top-color: #ff1a40; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #ff3355; font-size: 15px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎯 QUIZ CRIMSON</h1>
            <div class="progress-badge" id="progress-indicator">1 / 10</div>
        </div>

        <!-- 1. ÉCRAN CONFIGURATION -->
        <div id="setup-screen" class="screen">
            <div class="setup-content">
                <p>Bienvenue dans l'arène Crimson. Tape n'importe quel sujet en bas pour lancer une session exclusive de 10 questions générées par l'IA.</p>
            </div>
            <div class="bottom-bar">
                <input type="text" id="category-input" value="Football" placeholder="Ex: Anime, Électronique, Histoire...">
                <button class="btn" onclick="startQuizSession()">🚀 Lancer</button>
            </div>
        </div>

        <!-- 2. ÉCRAN CHARGEMENT AVEC MESSAGE D'ATTENTE -->
        <div id="loading-screen" class="screen hidden">
            <div class="loader-screen">
                <div class="spinner"></div>
                <div class="loading-text" id="loading-msg">🤖 L'IA analyse et forge tes 10 questions... Patiente un instant.</div>
            </div>
        </div>

        <!-- 3. ÉCRAN DU QUIZ -->
        <div id="quiz-screen" class="screen hidden">
            <div>
                <div class="stats-bar">
                    <span id="score-text">Score : 0</span>
                    <span id="streak-text">Série : 🔥 0</span>
                </div>

                <div class="question-box" id="question-text">
                    <span class="typing-cursor" id="typed-question"></span>
                </div>

                <div class="options" id="options-container"></div>
            </div>

            <div>
                <div class="timer-container">
                    <div class="timer-bar" id="timer-bar"></div>
                </div>
            </div>
        </div>

        <!-- 4. ÉCRAN DE FIN -->
        <div id="score-screen" class="screen hidden" style="justify-content: center; text-align: center; gap: 20px;">
            <h2 style="color: #ff3355; font-size: 22px;">🏆 Session Terminée !</h2>
            <p id="final-score-text" style="font-size: 16px; color: #fff;"></p>
            <div class="bottom-bar" style="border: none; padding: 0;">
                <button class="btn" style="width: 100%;" onclick="resetToSetup()">🔄 Rejouer</button>
            </div>
        </div>
    </div>

    <script>
        const AI_API_URL = 'https://christus-s-apis.vercel.app/api/na/ai/gemini';
        
        let questionsList = [];
        let currentIndex = 0;
        let score = 0;
        let streak = 0;
        let timer = null;
        let timeLeft = 30;

        const loadingMessages = [
            "🤖 L'IA rassemble les données et forge tes 10 questions...",
            "⚡ Connexion aux serveurs neuronaux en cours...",
            "🔥 Ajustement de la difficulté, prépare-toi...",
            "✨ Presque prêt, vérification des pièges..."
        ];

        function showScreen(screenId) {
            ['setup-screen', 'loading-screen', 'quiz-screen', 'score-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        async function startQuizSession() {
            const category = document.getElementById('category-input').value.trim() || "Culture Générale";
            
            showScreen('loading-screen');
            
            let msgIdx = 0;
            const msgInterval = setInterval(() => {
                msgIdx = (msgIdx + 1) % loadingMessages.length;
                const el = document.getElementById('loading-msg');
                if(el) el.innerText = loadingMessages[msgIdx];
            }, 2500);

            const prompt = `Génère exactement 10 questions de quiz uniques sur le thème "${category}". 
            Réponds STRICTEMENT sous forme d'un tableau JSON pur (sans markdown, ni balises ```json ... ```), contenant 10 objets avec cette structure exacte :
            [
              {
                "question": "Énoncé de la question",
                "options": ["Option A", "Option B", "Option C", "Option D"],
                "answer": "La réponse exacte (doit correspondre exactement à l'une des 4 options)"
              }
            ]`;

            try {
                const res = await fetch(AI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                let rawText = data?.result?.answer || data?.result || data?.answer || "";
                rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();

                clearInterval(msgInterval);
                questionsList = JSON.parse(rawText);
                currentIndex = 0;
                score = 0;
                streak = 0;

                showScreen('quiz-screen');
                loadQuestion();
            } catch (err) {
                clearInterval(msgInterval);
                console.error("Erreur génération:", err);
                alert("Erreur de génération par l'IA. Réessaie.");
                resetToSetup();
            }
        }

        function loadQuestion() {
            if (currentIndex >= questionsList.length) {
                endSession();
                return;
            }

            const q = questionsList[currentIndex];
            document.getElementById('progress-indicator').innerText = `${currentIndex + 1} / ${questionsList.length}`;
            document.getElementById('score-text').innerText = `Score : ${score}`;
            document.getElementById('streak-text').innerText = `Série : 🔥 ${streak}`;

            const target = document.getElementById('typed-question');
            target.innerText = "";
            let i = 0;
            const fullText = q.question;
            
            function typeWriter() {
                if (i < fullText.length) {
                    target.innerText += fullText.charAt(i);
                    i++;
                    setTimeout(typeWriter, 15);
                }
            }
            typeWriter();

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(opt, btn);
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 30;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';

            timer = setInterval(() => {
                timeLeft--;
                bar.style.width = `${(timeLeft / 30) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function selectAnswer(selected, btnElement) {
            clearInterval(timer);
            const q = questionsList[currentIndex];
            const buttons = document.querySelectorAll('.opt-btn');
            buttons.forEach(b => b.disabled = true);

            const isCorrect = selected.trim().toLowerCase() === q.answer.trim().toLowerCase();

            if (isCorrect) {
                score++;
                streak++;
                btnElement.classList.add('correct');
            } else {
                streak = 0;
                btnElement.classList.add('wrong');
                buttons.forEach(b => {
                    if (b.innerText.trim().toLowerCase() === q.answer.trim().toLowerCase()) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1500);
        }

        function handleTimeOut() {
            const q = questionsList[currentIndex];
            const buttons = document.querySelectorAll('.opt-btn');
            buttons.forEach(b => b.disabled = true);
            streak = 0;

            buttons.forEach(b => {
                if (b.innerText.trim().toLowerCase() === q.answer.trim().toLowerCase()) {
                    b.classList.add('correct');
                }
            });

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1500);
        }

        function endSession() {
            showScreen('score-screen');
            document.getElementById('progress-indicator').innerText = 'Terminé';
            document.getElementById('final-score-text').innerText = `Tu as obtenu ${score} / ${questionsList.length} bonnes réponses !`;
        }

        function resetToSetup() {
            showScreen('setup-screen');
            document.getElementById('progress-indicator').innerText = '1 / 10';
        }
    </script>
</body>
</html>
