<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMSON QUIZ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff1a40">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎯 CRIMSON QUIZ</h1>
            <div class="progress-badge" id="progress-indicator">Config</div>
        </div>

        <!-- ÉCRAN CONFIGURATION -->
        <div id="setup-screen" class="screen active">
            <div class="setup-content">
                <label>Mode de jeu</label>
                <div class="mode-selector">
                    <div class="mode-btn selected" id="btn-mode-solo" onclick="setGameMode('solo')">👤 Solo</div>
                    <div class="mode-btn" id="btn-mode-local" onclick="setGameMode('local')">👥 Local (Pass)</div>
                </div>

                <div id="local-players-group" class="hidden">
                    <label>Pseudos (séparés par des virgules)</label>
                    <input type="text" id="players-input" value="Joueur 1, Joueur 2" placeholder="Ex: Brayan, Seth, Alex">
                </div>

                <label>Thème du Quiz</label>
                <input type="text" id="category-input" value="Football" placeholder="Ex: Anime, Électronique, Histoire...">

                <label>Nombre de questions</label>
                <select id="count-select">
                    <option value="5">5 questions (Rapide)</option>
                    <option value="10" selected>10 questions (Standard)</option>
                    <option value="15">15 questions (Intense)</option>
                </select>

                <label>Niveau de difficulté</label>
                <select id="difficulty-select">
                    <option value="Facile">Facile</option>
                    <option value="Moyen" selected>Moyen</option>
                    <option value="Difficile">Difficile (Expert)</option>
                </select>
            </div>
            
            <div style="margin-top: 15px;">
                <button class="btn" onclick="startQuizSession()">🚀 Lancer la session</button>
            </div>
        </div>

        <!-- ÉCRAN PASS (MODE LOCAL) -->
        <div id="pass-screen" class="screen hidden" style="justify-content: center; text-align: center; gap: 20px;">
            <h2 style="color: #ff3355; font-size: 22px;">📱 Tour Suivant !</h2>
            <p id="pass-msg" style="font-size: 16px; color: #fff; line-height: 1.5;"></p>
            <button class="btn" onclick="startCurrentPlayerTurn()">▶️ Je suis prêt !</button>
        </div>

        <!-- ÉCRAN CHARGEMENT -->
        <div id="loading-screen" class="screen hidden">
            <div class="loader-screen">
                <div class="spinner"></div>
                <div class="loading-text" id="loading-msg">🤖 Initialisation des serveurs...</div>
            </div>
        </div>

        <!-- ÉCRAN DU QUIZ -->
        <div id="quiz-screen" class="screen hidden">
            <div>
                <div class="stats-bar">
                    <div>
                        <span class="player-tag" id="current-player-name">Joueur</span> | 
                        <span id="score-text">Score : 0</span> | 
                        <span id="streak-text">🔥 0</span>
                    </div>
                    <button class="btn btn-danger" onclick="confirmQuit()">🛑 Fin</button>
                </div>

                <div class="question-box">
                    <span class="typing-cursor" id="typed-question"></span>
                </div>

                <div class="options" id="options-container"></div>
            </div>

            <div>
                <div class="timer-container">
                    <div class="timer-bar" id="timer-bar"></div>
                </div>
            </div>
        </div>

        <!-- ÉCRAN CLASSEMENT / FIN -->
        <div id="score-screen" class="screen hidden" style="justify-content: center; text-align: center; gap: 15px;">
            <h2 style="color: #ff3355; font-size: 22px;" id="end-title">🏆 Session Terminée !</h2>
            <p id="final-score-text" style="font-size: 15px; color: #aa7780;"></p>

            <div class="leaderboard" id="leaderboard-container"></div>

            <div style="padding: 0;">
                <button class="btn" onclick="resetToSetup()">🔄 Rejouer</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log("Service Worker OK"))
          .catch((err) => console.log("Erreur SW:", err));
      }
    </script>
</body>
</html>
